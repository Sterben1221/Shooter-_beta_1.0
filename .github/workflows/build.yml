 name: Compilar PS2
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con ps2dev
        run: |
          docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache make >/dev/null 2>&1; make"
      - uses: actions/upload-artifact@v4
        with:
          name: fps-ps2
          path: fps.elf
